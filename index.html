<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<!-- ファビコン -->
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/asset/image/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="/asset/image/favicon-192.png">
<link rel="apple-touch-icon" href="/asset/image/apple-touch-icon.png">

<!-- Google Search Console 所有権確認 -->
<meta name="google-site-verification" content="mt-re1tV8P2szHFN1_EK3ncqbhgSs4AkueXvEoqhahU" />
<title>ココロノ庭園</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=BIZ+UDPMincho:wght@400;700&family=Caudex:wght@400;700&family=Zen+Kaku+Gothic+New:wght@500;700&family=Noto+Sans+JP:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#ffffff;          /* 白 */
    --bg-sub:#ffffff;
    --white:#ffffff;
    --text:#121212;
    --text-sub:rgba(18,18,18,.75);
    --green:#033521;       /* 深緑 */
    --gold:#bc964c;        /* 金茶 */
    --dark:#3a3a38;        /* 墨色 */
    --line:rgba(18,18,18,.12);
    --img:#c9c9c4;         /* 画像プレースホルダー */
    --img-dark:#8f8f8a;
    --serif:"BIZ UDPMincho",serif;
    --en:"Caudex",serif;
    --sans:"Noto Sans JP",sans-serif;
    --w:1200px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{background:var(--bg);color:var(--text-sub);font-family:var(--sans);font-size:15px;line-height:1.9;letter-spacing:.06em}
  a{color:inherit;text-decoration:none}
  img{max-width:100%;display:block}
  .inner{max-width:var(--w);margin:0 auto;padding:0 40px}

  /* 画像プレースホルダー */
  .ph{background:var(--img);position:relative;overflow:hidden}
  .ph::after{content:attr(data-label);position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.9);font-family:var(--en);font-size:14px;letter-spacing:.15em}
  .ph.dark{background:var(--img-dark)}

  /* 見出し */
  .en{display:flex;align-items:center;gap:8px;font-family:var(--en);font-size:14px;color:var(--text-sub);letter-spacing:.08em}
  .en::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--gold)}
  h1,h2,h3{font-family:var(--serif);color:var(--text);font-weight:400;letter-spacing:.1em}
  h2{font-size:30px;line-height:1.5;margin-bottom:6px}
  .ttl{margin-bottom:28px}

  /* ボタン */
  .btn{display:inline-flex;align-items:center;justify-content:space-between;width:210px;height:59px;padding:0 24px;background:var(--text);color:#fff;font-family:var(--en);font-size:16px;letter-spacing:.06em;transition:opacity .3s}
  .btn:hover{opacity:.8}
  .btn svg{width:14px}

  /* ===== ヘッダー ===== */
  .sns{display:flex;gap:18px}
  .sns span{width:18px;height:18px;border-radius:50%;background:var(--text)}
  header.site{position:sticky;top:0;z-index:50;background:var(--white);border-bottom:1px solid var(--line)}
  /* ec（WordPress）側に合わせる：Cocoonの文字詰めと字間 */
  header.site{font-feature-settings:"palt";letter-spacing:.96px}
  header.site .inner{position:relative;display:flex;flex-direction:column;align-items:center;gap:14px;padding-top:20px;padding-bottom:14px}
  .hd-icons{position:absolute;top:24px;right:40px;display:flex;gap:28px}
  .hd-icons a{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--green);transition:opacity .3s}
  .hd-icons a:hover{opacity:.6}
  .hd-icons img{width:22px;height:22px}
  /* カートの商品数バッジ（中身はページ下部のスクリプトで反映） */
  .hd-icons a{position:relative}
  .cart-count{position:absolute;left:13px;top:-8px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--green);color:#fff;font-family:var(--sans);font-size:11px;font-weight:700;font-style:normal;line-height:18px;letter-spacing:0;text-align:center;box-shadow:0 0 0 2px var(--white)}
  .cart-count[hidden]{display:none}
  .logo{font-family:"Zen Kaku Gothic New",sans-serif;color:var(--green);line-height:1;text-align:center}
  .logo b{display:block;font-size:30px;font-weight:700;letter-spacing:.06em}
  /* ヘッダー：タイトルの左にロゴマーク */
  header.site .logo{display:flex;align-items:center;gap:10px}
  header.site .logo img{width:46px;height:46px}
  nav.gnav ul{display:flex;justify-content:center;gap:40px;list-style:none;font-size:15px}
  nav.gnav a{padding-bottom:3px;border-bottom:1px solid transparent}
  nav.gnav a:hover,nav.gnav a.cur{border-color:var(--text);color:var(--text)}

  /* ===== FV ===== */
  .fv{position:relative;height:780px}
  .fv .ph{position:absolute;inset:0 0 0 0}
  .fv-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 30%}
  .fv::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.45),rgba(0,0,0,0) 55%);pointer-events:none}
  .fv-copy{position:absolute;left:8%;bottom:14%;color:#fff;z-index:2}
  .fv-copy h1{color:#fff;font-size:40px;line-height:1.6;text-shadow:0 2px 12px rgba(0,0,0,.25)}
  .fv-copy p{font-family:var(--serif);font-size:20px;margin-top:8px;letter-spacing:.15em}

  section{padding:110px 0}

  /* ===== About：画像＋白カード ===== */
  .about .inner{display:grid;grid-template-columns:1fr 1fr;align-items:center}
  .about .ph{aspect-ratio:4/3}
  .about .card{background:var(--white);padding:56px 50px 0;margin-left:-40px;margin-top:-80px;position:relative;z-index:1}
  .about .card p{margin-bottom:18px}
  .about .card .btn{margin:16px -50px 0 auto;display:flex}

  /* ===== フッター ===== */
  footer{padding:80px 0 30px;background:var(--green);color:#fff;font-size:14px}
  footer .logo{color:#fff}
  .f-top{display:grid;grid-template-columns:1fr 1fr 1fr;gap:40px;padding-bottom:50px;border-bottom:1px solid rgba(255,255,255,.25)}
  .f-top h4{font-family:var(--en);font-size:16px;color:#fff;font-weight:400;margin-bottom:14px}
  .f-top ul{list-style:none}
  .f-top li{margin-bottom:6px}
  .f-top a:hover{text-decoration:underline}
  .f-bottom{display:flex;justify-content:flex-end;align-items:center;padding-top:28px;font-size:12px}

  /* ===== レスポンシブ ===== */
  @media (max-width:900px){
    .inner{padding:0 16px}
    header.site .inner{gap:10px;padding-top:14px;padding-bottom:10px}
    .hd-icons{top:16px;right:16px;gap:12px}
    header.site .logo{align-self:flex-start;gap:8px}
    header.site .logo img{width:36px;height:36px}
    .hd-icons span{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
    nav.gnav ul{flex-wrap:wrap;gap:4px 20px;font-size:13px;letter-spacing:.03em}
    nav.gnav a{white-space:nowrap}
    .fv{height:520px}
    .fv-copy h1{font-size:26px}
    .fv-copy p{font-size:15px}
    section{padding:72px 0}
    h2{font-size:24px}
    .about .inner{grid-template-columns:1fr;gap:32px}
    .about .card{margin:-40px 16px 0;padding:36px 24px 0}
    .about .card .btn{margin-right:-24px}
    .f-top{grid-template-columns:1fr}
    .f-bottom{flex-direction:column;gap:14px}
  }
</style>
</head>
<body>

<!-- ヘッダー -->
<header class="site">
  <div class="inner">
    <a href="/" class="logo"><img src="asset/image/logo-mark.webp" alt="" width="46" height="46"><b>ココロノ庭園</b></a>
    <nav class="gnav">
      <ul>
        <li><a href="/" class="cur">ホーム</a></li>
        <li><a href="/column/">コラム</a></li>
      </ul>
    </nav>
    <div class="hd-icons">
      <a href="https://heal-place.com/ec/my-account/"><img src="asset/image/account.svg" alt="" width="22" height="22"><span>マイアカウント</span></a>
      <a href="https://heal-place.com/ec/cart/"><img src="asset/image/cart.svg" alt="" width="22" height="22"><b class="cart-count" hidden></b><span>カート</span></a>
    </div>
  </div>
</header>

<!-- FV -->
<div class="fv">
  <img class="fv-img" src="asset/image/top.png" alt="親子でミニ枯山水の砂紋を描いている様子" width="1774" height="887">
  <div class="fv-copy">
    <h1>大人の心に小さな遊びを</h1>
  </div>
</div>

<!-- About -->
<section class="about" id="about">
  <div class="inner">
    <div class="ph" data-label="IMAGE"></div>
    <div class="card">
      <div class="ttl">
        <h2>私たちについて</h2>
        <p class="en">About Us</p>
      </div>
      <p>ここに紹介文が入ります。ダミーテキストです。文章の長さや雰囲気を確認するために仮の文章を入れています。</p>
      <p>ここに紹介文が入ります。ダミーテキストです。文章の長さや雰囲気を確認するために仮の文章を入れています。</p>
      <a href="#" class="btn">More View <svg viewBox="0 0 14 9" fill="none"><path d="M0.5 4.5H13.3M8.45 8.5L13.5 4.5L8.45 0.5" stroke="white" stroke-linecap="round" stroke-linejoin="round"/></svg></a>
    </div>
  </div>
</section>

<!-- フッター -->
<footer>
  <div class="inner">
    <div class="f-top">
      <div>
        <a href="/" class="logo" style="display:inline-block"><b>ココロノ庭園</b></a>
      </div>
    </div>
    <div class="f-bottom">
      <p>© 2026, kokoro no teien</p>
    </div>
  </div>
</footer>

<script>
// カートの商品数をヘッダーのカートマークに表示（WooCommerceのカートフラグメントから取得）
fetch('/ec/?wc-ajax=get_refreshed_fragments',{method:'POST',credentials:'same-origin'})
  .then(function(r){return r.ok?r.json():null})
  .then(function(d){
    var html=d&&d.fragments&&d.fragments['b.hp-cart-count'];
    var m=html&&/>(\d+\+?)</.exec(html);
    var el=document.querySelector('.cart-count');
    if(el&&m&&m[1]!=='0'){el.textContent=m[1];el.hidden=false}
  })
  .catch(function(){});
</script>
</body>
</html>
